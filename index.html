<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HC - Compromiso y Responsabilidad</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #17202a;
    }

    .container {
      max-width: 950px;
      margin: auto;
      padding: 24px 18px 50px;
    }

    .login-container {
      max-width: 430px;
      margin: 40px auto;
      padding: 18px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 52px;
    }

    h1 {
      margin: 5px 0;
    }

    .subtitle {
      color: #667085;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,.07);
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #111827;
      color: white;
    }

    button.secondary {
      background: #e5e7eb;
      color: #111827;
    }

    button.approve {
      background: #087443;
    }

    button.reject {
      background: #b42318;
    }

    button.small {
      padding: 8px 12px;
      font-size: 13px;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #b42318;
      background: #fef3f2;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      display: none;
    }

    .success {
      color: #067647;
      background: #ecfdf3;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      display: none;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .welcome {
      font-size: 25px;
      font-weight: bold;
    }

    .muted {
      color: #667085;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    .stat-title {
      color: #667085;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 23px;
      font-weight: bold;
    }

    .players {
      display: grid;
      gap: 10px;
    }

    .player {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border: 1px solid #eaecf0;
      border-radius: 12px;
      gap: 12px;
    }

    .player-name {
      font-weight: bold;
      font-size: 16px;
    }

    .badge {
      background: #eef2ff;
      color: #3730a3;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
    }

    .payment {
      border: 1px solid #eaecf0;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .payment-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .payment-amount {
      font-size: 21px;
      font-weight: bold;
    }

    .payment-info {
      color: #667085;
      font-size: 14px;
      line-height: 1.6;
    }

    .payment-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #667085;
    }

    @media (max-width: 750px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .player {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="login-container">

  <div class="header">
    <div class="logo">⚽</div>
    <h1>HC</h1>
    <div class="subtitle">
      Compromiso y Responsabilidad
    </div>
  </div>

  <div class="card">

    <h2>Ingresar</h2>

    <div id="loginError" class="error"></div>

    <label>Email</label>

    <input
      id="email"
      type="email"
      placeholder="tu@email.com"
      autocomplete="email"
    >

    <label>Contraseña</label>

    <input
      id="password"
      type="password"
      placeholder="Tu contraseña"
      autocomplete="current-password"
    >

    <button id="loginButton" style="width:100%;">
      Ingresar
    </button>

  </div>

</div>


<!-- ADMIN -->

<div id="adminPage" class="container hidden">

  <div class="topbar">

    <div>
      <div class="welcome">
        ⚽ HC
      </div>

      <div class="muted">
        Panel de administración
      </div>
    </div>

    <button
      id="logoutButton"
      class="secondary"
    >
      Cerrar sesión
    </button>

  </div>


  <div id="adminError" class="error"></div>

  <div id="adminSuccess" class="success"></div>


  <!-- ESTADÍSTICAS -->

  <div class="stats">

    <div class="stat">

      <div class="stat-title">
        Jugadores
      </div>

      <div
        id="playersCount"
        class="stat-value"
      >
        -
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Inscripción total
      </div>

      <div
        id="registrationTotal"
        class="stat-value"
      >
        $0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Pagos aprobados
      </div>

      <div
        id="approvedTotal"
        class="stat-value"
      >
        $0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Pendientes
      </div>

      <div
        id="pendingCount"
        class="stat-value"
      >
        0
      </div>

    </div>

  </div>


  <!-- PAGOS PENDIENTES -->

  <div class="card">

    <h2>
      ⏳ Pagos pendientes
    </h2>

    <div id="pendingPayments">

      <div class="empty">
        Cargando pagos...
      </div>

    </div>

  </div>


  <!-- JUGADORES -->

  <div class="card">

    <h2>
      👥 Jugadores
    </h2>

    <div
      id="playersList"
      class="players"
    >

      <div class="empty">
        Cargando jugadores...
      </div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://kyuwzcmrdylrhjrblcuw.supabase.co";


/*
  IMPORTANTE:
  Pegá acá TU CLAVE PUBLISHABLE actual.
  NO uses service_role.
*/

const SUPABASE_KEY =
  "sb_publishable_Skz1JtNhc11MsOLS-V_X-A_6GkBwFw0";


const { createClient } = supabase;

const client =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   ELEMENTOS
===================================================== */

const loginPage =
  document.getElementById("loginPage");

const adminPage =
  document.getElementById("adminPage");

const loginError =
  document.getElementById("loginError");

const adminError =
  document.getElementById("adminError");

const adminSuccess =
  document.getElementById("adminSuccess");


/* =====================================================
   UTILIDADES
===================================================== */

function formatMoney(value) {

  return new Intl.NumberFormat(
    "es-AR",
    {
      style: "currency",
      currency: "ARS",
      maximumFractionDigits: 0
    }
  ).format(value || 0);

}


function showLoginError(message) {

  loginError.textContent =
    message;

  loginError.style.display =
    "block";

}


function showAdminError(message) {

  adminError.textContent =
    message;

  adminError.style.display =
    "block";

}


function showAdminSuccess(message) {

  adminSuccess.textContent =
    message;

  adminSuccess.style.display =
    "block";

  setTimeout(() => {

    adminSuccess.style.display =
      "none";

  }, 4000);

}


/* =====================================================
   LOGIN
===================================================== */

async function login() {

  loginError.style.display =
    "none";

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if (!email || !password) {

    showLoginError(
      "Completá email y contraseña."
    );

    return;

  }


  const { error } =
    await client.auth.signInWithPassword({

      email,
      password

    });


  if (error) {

    showLoginError(
      error.message
    );

    return;

  }


  await loadApplication();

}


/* =====================================================
   CARGAR APLICACIÓN
===================================================== */

async function loadApplication() {

  const {

    data: {
      user
    },

    error: userError

  } = await client.auth.getUser();


  if (
    userError ||
    !user
  ) {

    loginPage.classList.remove(
      "hidden"
    );

    adminPage.classList.add(
      "hidden"
    );

    return;

  }


  const {

    data: account,
    error: accountError

  } = await client

    .from("player_accounts")

    .select(
      "role, player_id"
    )

    .eq(
      "auth_user_id",
      user.id
    )

    .single();


  if (accountError) {

    showLoginError(
      "No encontramos tu cuenta de HC."
    );

    return;

  }


  if (
    account.role ===
    "admin"
  ) {

    loginPage.classList.add(
      "hidden"
    );

    adminPage.classList.remove(
      "hidden"
    );

    await loadAdminDashboard();

  }

}


/* =====================================================
   PANEL ADMIN
===================================================== */

async function loadAdminDashboard() {

  adminError.style.display =
    "none";


  /* ---------------------------------
     JUGADORES
  --------------------------------- */

  const {

    data: players,
    error: playersError

  } = await client

    .from("players")

    .select("*")

    .eq(
      "active",
      true
    )

    .order(
      "name"
    );


  if (playersError) {

    showAdminError(
      playersError.message
    );

    return;

  }


  /* ---------------------------------
     CARGOS
  --------------------------------- */

  const {

    data: charges,
    error: chargesError

  } = await client

    .from("charges")

    .select("*");


  if (chargesError) {

    showAdminError(
      chargesError.message
    );

    return;

  }


  /* ---------------------------------
     PAGOS
  --------------------------------- */

  const {

    data: payments,
    error: paymentsError

  } = await client

    .from("payments")

    .select("*")

    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (paymentsError) {

    showAdminError(
      paymentsError.message
    );

    return;

  }


  /* ---------------------------------
     ESTADÍSTICAS
  --------------------------------- */

  const registrationTotal =
    (charges || [])

      .filter(
        c =>
          c.charge_type ===
          "registration"
      )

      .reduce(
        (sum, c) =>
          sum +
          Number(
            c.amount || 0
          ),
        0
      );


  const approvedPayments =
    (payments || [])
      .filter(
        p =>
          p.status ===
          "approved"
      );


  const pendingPayments =
    (payments || [])
      .filter(
        p =>
          p.status ===
          "pending"
      );


  const approvedTotal =
    approvedPayments
      .reduce(
        (sum, p) =>
          sum +
          Number(
            p.amount || 0
          ),
        0
      );


  document
    .getElementById(
      "playersCount"
    )
    .textContent =
    players.length;


  document
    .getElementById(
      "registrationTotal"
    )
    .textContent =
    formatMoney(
      registrationTotal
    );


  document
    .getElementById(
      "approvedTotal"
    )
    .textContent =
    formatMoney(
      approvedTotal
    );


  document
    .getElementById(
      "pendingCount"
    )
    .textContent =
    pendingPayments.length;


  /* ---------------------------------
     MOSTRAR PAGOS
  --------------------------------- */

  renderPendingPayments(
    pendingPayments,
    players
  );


  /* ---------------------------------
     MOSTRAR JUGADORES
  --------------------------------- */

  renderPlayers(
    players,
    charges,
    payments
  );

}


/* =====================================================
   PAGOS PENDIENTES
===================================================== */

function renderPendingPayments(
  payments,
  players
) {

  const container =
    document.getElementById(
      "pendingPayments"
    );


  if (!payments.length) {

    container.innerHTML = `

      <div class="empty">

        No hay pagos pendientes. ✅

      </div>

    `;

    return;

  }


  container.innerHTML =
    payments.map(
      payment => {

        const player =
          players.find(
            p =>
              p.id ===
              payment.player_id
          );


        const playerName =
          player
            ? player.name
            : "Jugador";


        return `

          <div class="payment">

            <div class="payment-header">

              <div>

                <div class="player-name">

                  ${playerName}

                </div>

                <div class="payment-info">

                  ${payment.payment_method || "Medio no indicado"}

                  ·

                  ${payment.payment_date || ""}

                </div>

              </div>


              <div class="payment-amount">

                ${formatMoney(
                  payment.amount
                )}

              </div>

            </div>


            <div class="payment-info">

              ${payment.notes || "Sin observaciones"}

            </div>


            <div class="payment-actions">

              <button
                class="approve small"
                onclick="approvePayment('${payment.id}')"
              >

                ✓ Aprobar

              </button>


              <button
                class="reject small"
                onclick="rejectPayment('${payment.id}')"
              >

                ✕ Rechazar

              </button>


              ${
                payment.receipt_url
                  ? `

                    <button
                      class="secondary small"
                      onclick="viewReceipt('${payment.receipt_url}')"
                    >

                      📸 Comprobante

                    </button>

                  `
                  : ""
              }

            </div>

          </div>

        `;

      }
    ).join("");

}


/* =====================================================
   JUGADORES
===================================================== */

function renderPlayers(
  players,
  charges,
  payments
) {

  const container =
    document.getElementById(
      "playersList"
    );


  if (!players.length) {

    container.innerHTML =
      `<div class="empty">
        No hay jugadores.
      </div>`;

    return;

  }


  container.innerHTML =
    players.map(
      player => {

        const playerCharges =
          charges.filter(
            c =>
              c.player_id ===
              player.id
          );


        const playerPayments =
          payments.filter(
            p =>
              p.player_id ===
              player.id &&
              p.status ===
              "approved"
          );


        const totalCharges =
          playerCharges.reduce(
            (sum, c) =>
              sum +
              Number(
                c.amount || 0
              ),
            0
          );


        const totalPaid =
          playerPayments.reduce(
            (sum, p) =>
              sum +
              Number(
                p.amount || 0
              ),
            0
          );


        const balance =
          totalCharges -
          totalPaid;


        let badge =
          "Al día";


        if (balance > 0) {

          badge =
            "Debe " +
            formatMoney(
              balance
            );

        }


        if (balance < 0) {

          badge =
            "A favor " +
            formatMoney(
              Math.abs(
                balance
              )
            );

        }


        return `

          <div class="player">

            <div>

              <div class="player-name">

                ${player.name}

              </div>

              <div class="muted">

                Cargos:
                ${formatMoney(
                  totalCharges
                )}

                ·

                Pagado:
                ${formatMoney(
                  totalPaid
                )}

              </div>

            </div>


            <div class="badge">

              ${badge}

            </div>

          </div>

        `;

      }
    ).join("");

}


/* =====================================================
   APROBAR PAGO
===================================================== */

async function approvePayment(
  paymentId
) {

  const {
    error
  } = await client

    .from("payments")

    .update({

      status:
        "approved",

      approved_at:
        new Date()
          .toISOString()

    })

    .eq(
      "id",
      paymentId
    );


  if (error) {

    showAdminError(
      "No se pudo aprobar: " +
      error.message
    );

    return;

  }


  showAdminSuccess(
    "Pago aprobado correctamente."
  );


  await loadAdminDashboard();

}


/* =====================================================
   RECHAZAR PAGO
===================================================== */

async function rejectPayment(
  paymentId
) {

  const confirmed =
    confirm(
      "¿Seguro que querés rechazar este pago?"
    );


  if (!confirmed)
    return;


  const {
    error
  } = await client

    .from("payments")

    .update({

      status:
        "rejected",

      approved_at:
        null

    })

    .eq(
      "id",
      paymentId
    );


  if (error) {

    showAdminError(
      "No se pudo rechazar: " +
      error.message
    );

    return;

  }


  showAdminSuccess(
    "Pago rechazado."
  );


  await loadAdminDashboard();

}


/* =====================================================
   COMPROBANTE
===================================================== */

async function viewReceipt(
  path
) {

  const {
    data,
    error
  } = await client.storage

    .from("comprobantes")

    .createSignedUrl(
      path,
      300
    );


  if (error) {

    showAdminError(
      "No se pudo abrir el comprobante: " +
      error.message
    );

    return;

  }


  window.open(
    data.signedUrl,
    "_blank"
  );

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

  await client.auth.signOut();

  adminPage.classList.add(
    "hidden"
  );

  loginPage.classList.remove(
    "hidden"
  );

}


/* =====================================================
   EVENTOS
===================================================== */

document
  .getElementById(
    "loginButton"
  )
  .addEventListener(
    "click",
    login
  );


document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    logout
  );


/* =====================================================
   SESIÓN EXISTENTE
===================================================== */

client.auth
  .getSession()
  .then(
    ({
      data
    }) => {

      if (
        data.session
      ) {

        loadApplication();

      }

    }
  );

</script>

</body>
</html>
