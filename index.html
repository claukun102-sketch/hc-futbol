<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HC - Compromiso y Responsabilidad</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #17202a;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 18px 50px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 50px;
    }

    h1 {
      margin: 5px 0;
    }

    .subtitle {
      color: #667085;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,.07);
      margin-bottom: 18px;
    }

    .error {
      color: #b42318;
      background: #fef3f2;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      display: none;
    }

    .hidden {
      display: none;
    }

    .login-container {
      max-width: 430px;
      margin: 40px auto;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #111827;
      color: white;
    }

    button.secondary {
      background: #e5e7eb;
      color: #111827;
    }

    button.danger {
      background: #b42318;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .welcome {
      font-size: 24px;
      font-weight: bold;
    }

    .muted {
      color: #667085;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    .stat-title {
      color: #667085;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: bold;
    }

    .players {
      display: grid;
      gap: 10px;
    }

    .player {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border: 1px solid #eaecf0;
      border-radius: 12px;
      gap: 10px;
    }

    .player-name {
      font-weight: bold;
    }

    .badge {
      background: #eef2ff;
      color: #3730a3;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #667085;
    }

    @media (max-width: 650px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .player {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-container">
  <div class="header">
    <div class="logo">⚽</div>
    <h1>HC</h1>
    <div class="subtitle">Compromiso y Responsabilidad</div>
  </div>

  <div class="card">
    <h2>Ingresar</h2>

    <div id="loginError" class="error"></div>

    <label>Email</label>
    <input
      id="email"
      type="email"
      placeholder="tu@email.com"
      autocomplete="email"
    >

    <label>Contraseña</label>
    <input
      id="password"
      type="password"
      placeholder="Tu contraseña"
      autocomplete="current-password"
    >

    <button id="loginButton" style="width:100%;">
      Ingresar
    </button>
  </div>
</div>


<!-- ADMIN -->
<div id="adminPage" class="container hidden">

  <div class="topbar">
    <div>
      <div class="welcome">⚽ HC</div>
      <div class="muted">Panel de administración</div>
    </div>

    <button id="logoutButton" class="secondary">
      Cerrar sesión
    </button>
  </div>

  <div id="adminError" class="error"></div>

  <div class="stats">

    <div class="stat">
      <div class="stat-title">Jugadores</div>
      <div id="playersCount" class="stat-value">-</div>
    </div>

    <div class="stat">
      <div class="stat-title">Inscripción total</div>
      <div id="registrationTotal" class="stat-value">$0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Cargado</div>
      <div id="chargedTotal" class="stat-value">$0</div>
    </div>

  </div>

  <div class="card">
    <h2>👥 Jugadores</h2>

    <div id="playersList" class="players">
      <div class="loading">Cargando jugadores...</div>
    </div>
  </div>

</div>


<script>
const SUPABASE_URL = "https://kyuwzcmrdylrhjrblcuw.supabase.co";

/*
  IMPORTANTE:
  Mantené acá TU clave publishable actual.
  No uses nunca una service_role key.
*/
const SUPABASE_KEY = "sb_publishable_Skz1JtNhc11MsOLS-V_X-A_6GkBwFw0";

const { createClient } = supabase;
const client = createClient(SUPABASE_URL, SUPABASE_KEY);

const loginPage = document.getElementById("loginPage");
const adminPage = document.getElementById("adminPage");
const loginError = document.getElementById("loginError");
const adminError = document.getElementById("adminError");


function formatMoney(value) {
  return new Intl.NumberFormat("es-AR", {
    style: "currency",
    currency: "ARS",
    maximumFractionDigits: 0
  }).format(value || 0);
}


function showLoginError(message) {
  loginError.textContent = message;
  loginError.style.display = "block";
}


function showAdminError(message) {
  adminError.textContent = message;
  adminError.style.display = "block";
}


async function login() {

  loginError.style.display = "none";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showLoginError("Completá email y contraseña.");
    return;
  }

  const { error } = await client.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    showLoginError(error.message);
    return;
  }

  await loadApplication();
}


async function loadApplication() {

  const {
    data: { user },
    error: userError
  } = await client.auth.getUser();

  if (userError || !user) {
    loginPage.classList.remove("hidden");
    adminPage.classList.add("hidden");
    return;
  }

  const {
    data: account,
    error: accountError
  } = await client
    .from("player_accounts")
    .select("role, player_id")
    .eq("auth_user_id", user.id)
    .single();

  if (accountError) {
    showAdminError(
      "No pudimos encontrar tu cuenta en player_accounts."
    );
    return;
  }

  if (account.role === "admin") {

    loginPage.classList.add("hidden");
    adminPage.classList.remove("hidden");

    await loadAdminDashboard();

  } else {

    loginPage.classList.add("hidden");
    adminPage.classList.remove("hidden");

    adminPage.innerHTML = `
      <div class="card">
        <h2>👤 Cuenta de jugador</h2>
        <p>Tu cuenta está correctamente conectada.</p>
        <p class="muted">
          El panel del jugador todavía está en construcción.
        </p>
        <button onclick="logout()" class="secondary">
          Cerrar sesión
        </button>
      </div>
    `;
  }
}


async function loadAdminDashboard() {

  adminError.style.display = "none";

  /*
    Cargar jugadores
  */
  const {
    data: players,
    error: playersError
  } = await client
    .from("players")
    .select("*")
    .order("id");

  if (playersError) {
    showAdminError(
      "Error cargando jugadores: " + playersError.message
    );
    return;
  }


  /*
    Cargar cargos
  */
  const {
    data: charges,
    error: chargesError
  } = await client
    .from("charges")
    .select("*");

  if (chargesError) {
    showAdminError(
      "Error cargando cargos: " + chargesError.message
    );
    return;
  }


  /*
    Cargar pagos
  */
  const {
    data: payments,
    error: paymentsError
  } = await client
    .from("payments")
    .select("*");

  if (paymentsError) {
    showAdminError(
      "Error cargando pagos: " + paymentsError.message
    );
    return;
  }


  /*
    Estadísticas
  */
  const registrationCharges = (charges || [])
    .filter(c => {
      const type = String(c.charge_type || "").toLowerCase();
      return type.includes("registration")
        || type.includes("inscrip");
    });

  const registrationTotal = registrationCharges
    .reduce((sum, c) => sum + Number(c.amount || 0), 0);


  const approvedPayments = (payments || [])
    .filter(p => p.status === "approved");

  const chargedTotal = approvedPayments
    .reduce((sum, p) => sum + Number(p.amount || 0), 0);


  document.getElementById("playersCount").textContent =
    players.length;

  document.getElementById("registrationTotal").textContent =
    formatMoney(registrationTotal);

  document.getElementById("chargedTotal").textContent =
    formatMoney(chargedTotal);


  /*
    Lista de jugadores
  */
  const playersList = document.getElementById("playersList");

  if (!players.length) {
    playersList.innerHTML =
      '<div class="loading">No hay jugadores cargados.</div>';
    return;
  }


  playersList.innerHTML = players.map(player => {

    const playerCharges = (charges || [])
      .filter(c => c.player_id === player.id);

    const playerPayments = (payments || [])
      .filter(p => p.player_id === player.id && p.status === "approved");

    const totalCharged = playerCharges
      .reduce((sum, c) => sum + Number(c.amount || 0), 0);

    const totalPaid = playerPayments
      .reduce((sum, p) => sum + Number(p.amount || 0), 0);

    const balance = totalCharged - totalPaid;

    let badgeText = "Al día";

    if (balance > 0) {
      badgeText = "Debe " + formatMoney(balance);
    }

    if (balance < 0) {
      badgeText = "A favor " + formatMoney(Math.abs(balance));
    }

    return `
      <div class="player">

        <div>
          <div class="player-name">
            ${player.name}
          </div>

          <div class="muted">
            Cargos: ${formatMoney(totalCharged)}
            · Pagado: ${formatMoney(totalPaid)}
          </div>
        </div>

        <div class="badge">
          ${badgeText}
        </div>

      </div>
    `;

  }).join("");
}


async function logout() {

  await client.auth.signOut();

  adminPage.classList.add("hidden");
  loginPage.classList.remove("hidden");
}


document
  .getElementById("loginButton")
  .addEventListener("click", login);

document
  .getElementById("logoutButton")
  .addEventListener("click", logout);


/*
  Si ya existe una sesión, cargar automáticamente.
*/
client.auth.getSession().then(({ data }) => {

  if (data.session) {
    loadApplication();
  }

});
</script>

</body>
</html>
